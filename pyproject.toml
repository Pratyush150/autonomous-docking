[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autodock"
version = "0.1.0"
description = "Autonomous docking of a differential-drive robot to a charging station: state machine, controller, perception model and Monte Carlo harness"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["robotics", "docking", "differential drive", "state machine", "fiducial", "monte carlo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plots = ["matplotlib>=3.4"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Pratyush150/autonomous-docking"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
